name: Publish to NPM and MCP Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for npm Trusted Publishing and MCP Registry OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Check if version exists
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already exists on npm"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION does not exist, will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM (Trusted Publishing OIDC)
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      - name: Skip publishing
        if: steps.version-check.outputs.should_publish == 'false'
        run: echo "Skipping publish - version already exists on npm"

      - name: Install MCP Publisher
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.20/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        if: steps.version-check.outputs.should_publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.version-check.outputs.should_publish == 'true'
        run: ./mcp-publisher publish
